# news.aibaseclub.com — 도메인 루트 robots.txt 를 앱으로 넘긴다 (P0-2, 결정 D2).
# 앱(src/app/robots.ts)이 /ainews/robots.txt 를 내므로 규칙의 기준은 앱 하나다.
#
# 적용(메인 세션, 운영 nginx):
#   /etc/nginx/sites-enabled/news.aibaseclub.com 의 443 server 블록 안, `location = / { ... }` 바로 아래에 붙인다.
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -sI https://news.aibaseclub.com/robots.txt   # 200, content-type: text/plain
#   curl -s  https://news.aibaseclub.com/robots.txt   # Sitemap: https://news.aibaseclub.com/ainews/sitemap.xml
# 되돌리기: 이 location 블록을 지우고 reload (robots.txt 가 다시 404 가 된다).
# 운영 서버를 옮기면 그쪽 nginx 에도 같은 블록을 넣는다(포트는 그 서버의 앱 포트).

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3012/ainews/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
